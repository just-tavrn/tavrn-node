# cargo deny configuration (docs/LICENSES.md). `cargo deny check` runs in the CI;
# `just license-check` runs the license part locally.

[graph]
all-features = true

[licenses]
# Explicit allow-list: permissive licenses and MPL-2.0 (file-level copyleft, compatible with all our
# licenses). No (A)GPL/LGPL: the crypto core (MPL-2.0) and everything the web client or the SDK could pull in
# must stay free of it. The node itself (AGPL-3.0-only) may use GPL-compatible copyleft crates, but only
# through a crate-specific exception below that names the node crate's dependency, never globally, and only
# after checking with `cargo tree -i <crate>` that tavrn-crypto does not depend on it.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.93
# The list is the project-wide allow-list (also for future dependencies); entries nobody uses today are fine.
unused-allowed-license = "allow"

# Our own crates carry the licenses of LICENSE.md.
[[licenses.exceptions]]
crate = "tavrn-node"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "tavrn-perf-loadgen"
allow = ["AGPL-3.0-only"]

# Mozilla's CA certificate bundle compiled into the TLS stacks (rustls via reqwest, lettre, sqlx): data
# under the permissive Community Data License Agreement, not code.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
yanked = "deny"
# Accepted until upstream moves (docs/LICENSES.md, section 2). Review on every dependency update.
ignore = [
    # rsa 0.9 (Marvin timing attack) via jsonwebtoken and livekit-api: no fixed version exists. The node uses
    # RSA only to verify ID-token signatures of SSO providers with their public keys; the timing side channel
    # concerns private-key operations, which never happen here.
    { id = "RUSTSEC-2023-0071", reason = "rsa used for signature verification with public keys only; no fix upstream" },
    # proc-macro-error2 is unmaintained: a build-time macro crate via tavrn-crypto -> openmls_rust_crypto ->
    # hpke-rs -> libcrux, not part of the binary's runtime code.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained build-time macro crate deep in the OpenMLS stack" },
    # Owner-approved temporary exception, tracked in https://github.com/just-tavrn/tavrn-crypto/issues/24.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only: elliptic-curve 0.13 <- p256/p384/k256/ecdsa 0.13 <- openmls_rust_crypto 0.6 / hpke-rs-rust-crypto 0.7, and jsonwebtoken 11 (verify only); tavrn uses only MLS suite 0x0001 (X25519/Ed25519), NIST curves only verify public data; tracking https://github.com/just-tavrn/tavrn-crypto/issues/24; expires 2026-12-26" },
]

[bans]
multiple-versions = "warn"
# The advisory ignore above matches RUSTSEC-2026-0387 for every version; it is meant for crypto-bigint 0.5.5
# only, so the affected 0.7 releases stay banned.
deny = [
    { crate = "crypto-bigint:>=0.6.0, <0.7.6", reason = "RUSTSEC-2026-0387: affected versions; the advisory ignore (tavrn-crypto#24) is meant for 0.5.5 only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The encryption core is consumed by tag from its repository until it is published on crates.io.
allow-git = ["https://github.com/just-tavrn/tavrn-crypto"]
