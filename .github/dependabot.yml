version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # The build toolchain stays on the Node LTS the runner image uses; Node 26's alpine image has no corepack.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly }
