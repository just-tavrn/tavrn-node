# SPDX-License-Identifier: AGPL-3.0-only
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly }
