# SPDX-License-Identifier: AGPL-3.0-only
#
# Node performance budgets (perf/README.md): nightly and by hand, never on pull requests. Release builds, the
# load generator against a release node with PostgreSQL, then the report (fails when a metric is over budget).
# Gated by CI_ENABLED (docs/GITHUB.md).
name: Performance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  perf:
    name: Node performance budgets
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_USER: tavrn, POSTGRES_PASSWORD: tavrn, POSTGRES_DB: tavrn_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tavrn" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository itself is fetched with the job's own token (the fine-grained READ_TOKEN need not cover
          # it, and both at once answered 403 on the nightly run of 2026-10-08); the private submodule follows
          # through the URL rewrite above, like the organization's rust-ci.yml.
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo build --release --locked -p tavrn-node -p tavrn-perf-loadgen
      - name: Node benchmarks
        run: target/release/tavrn-loadgen
        env:
          TAVRN_TEST_DATABASE_URL: postgres://tavrn:tavrn@localhost:5432/tavrn_test
      - name: Report (fails when a metric is over budget)
        if: success() || failure()
        run: node perf/report.ts perf/results/raw/node.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: perf/results
          if-no-files-found: ignore
