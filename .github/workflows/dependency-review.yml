# SPDX-License-Identifier: AGPL-3.0-only
#
# Reviews dependency changes of pull requests: refuses known vulnerabilities and licenses outside the
# allow-list (the same list as deny.toml). Gated by CI_ENABLED; GitHub
# offers the dependency graph for private repositories only with Advanced Security (docs/GITHUB.md).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    # Private repositories get the dependency graph only with Advanced Security: the job waits for publication.
    if: ${{ vars.CI_ENABLED == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, MIT-0, 0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
            MPL-2.0, Zlib, Unicode-3.0, Unicode-DFS-2016, CC0-1.0, BSL-1.0, Unlicense
