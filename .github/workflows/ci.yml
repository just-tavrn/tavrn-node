# SPDX-License-Identifier: AGPL-3.0-only
#
# Uses the organization's reusable workflows (just-tavrn/.github). Every job is gated by the repository
# variable CI_ENABLED (docs/GITHUB.md): nothing runs until the owner sets it to "true".
name: CI

on:
  push:
    branches: [main]
  # Pull requests get the Rust and hygiene checks; the image (25 minutes on the heavy runner) is built on main
  # only, as the edge image, and by hand.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/rust-ci.yml@main
    with:
      runner: tavrn-heavy
      # rustfmt, clippy (node and load generator), the tests on PostgreSQL (incl. the protocol test vectors and
      # the comparison with protocol/openapi.json from the submodule) with a Valkey for the cluster tests,
      # cargo deny with deny.toml.
      clippy-args: --workspace --all-targets --locked
      test-args: --workspace --locked
      postgres: true
      pre-test: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          # The runner image ships livekit-server, ffmpeg and a private Valkey on 127.0.0.1:6379 (the
          # organization's runner/README.md); a container started on the stack's DinD would not be reachable
          # from this runner at 127.0.0.1 anyway.
          echo "TAVRN_TEST_CACHE_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
          livekit-server --version && ffmpeg -version | head -1 && valkey-cli -p 6379 ping
          exit 0
        fi
        # Voice (protocol/VOICE.md): the node supervises livekit-server; the voice tests need the binary.
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" livekit-server
        "$HOME/.local/bin/livekit-server" --version
        # Media pipeline (src/media.rs): ffmpeg with libwebp, like `just ffmpeg-install`.
        tmp="$(mktemp -d)"
        curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ -C "$tmp" --strip-components=2 --wildcards '*/bin/ffmpeg'
        install -m 0755 "$tmp/ffmpeg" "$HOME/.local/bin/ffmpeg"
        "$HOME/.local/bin/ffmpeg" -hide_banner -encoders | grep -q libwebp_anim
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # Valkey for the cluster tests (several instances of one node, docs/SCALING.md).
        docker run -d --name valkey -p 56379:6379 valkey/valkey:8
        for _ in $(seq 30); do docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      # Appended to GITHUB_ENV before pre-test runs. LIVEKIT_VERSION: the same as the justfile and deploy/Dockerfile.
      test-env: |
        TAVRN_TEST_CACHE_URL=redis://127.0.0.1:56379
        TAVRN_TEST_REQUIRE_LIVEKIT=1
        LIVEKIT_VERSION=1.13.7
    secrets:
      # The protocol submodule and the tavrn-crypto git dependency are private until the repositories go public.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  hygiene:
    name: SPDX headers, publication hygiene, perf report
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: No private files, domains or secrets
        env:
          # Comma-separated private domains, hosts and addresses (repository or organization secret).
          PUBLISH_CHECK_PRIVATE: ${{ secrets.PUBLISH_CHECK_PRIVATE }}
        run: scripts/publish-check.sh
      - name: Unit tests of the performance report
        run: node --test perf/report.test.ts

  web-ref:
    # The commit of tavrn-web that goes into the image. The build cache keys the web stage by its build arguments:
    # with the branch name alone ("main") a rebuilt image would keep the cached, stale bundle of an earlier main.
    # Resolving the branch to its current commit here makes every change of the web client a cache miss.
    name: Web client commit
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          WEB_REF: ${{ vars.TAVRN_WEB_REF || 'main' }}
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if printf '%s' "$WEB_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$WEB_REF"
          else
            url="https://github.com/just-tavrn/tavrn-web"
            [ -n "$READ_TOKEN" ] && url="https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/tavrn-web"
            sha="$(git ls-remote "$url" "refs/heads/$WEB_REF" "refs/tags/$WEB_REF^{}" "refs/tags/$WEB_REF" | head -1 | cut -f1)"
          fi
          [ -n "$sha" ] || { echo "::error::tavrn-web ref '$WEB_REF' not found"; exit 1; }
          echo "tavrn-web $WEB_REF = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  image:
    # Pushes to main (and manual runs on main) publish the image as ghcr.io/just-tavrn/tavrn-node:edge (plus a
    # short sha tag), the image tavrn-web's end-to-end suite runs against by default; pull requests do not build
    # it (development phase, 2026-10-08). Releases are tagged by release.yml.
    name: Container image
    needs: web-ref
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: just-tavrn/.github/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      runner: tavrn-heavy
      dockerfile: deploy/Dockerfile
      image-name: tavrn-node
      build-args: |
        TAVRN_WEB_REF=${{ needs.web-ref.outputs.sha }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      # Read access to tavrn-crypto (cargo) and tavrn-web (the web stage), passed as the build secret read_token.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
