# SPDX-License-Identifier: AGPL-3.0-only
#
# Uses the organization's reusable workflows (just-tavrn/.github). Every job is gated by the repository
# variable CI_ENABLED (docs/GITHUB.md): nothing runs until the owner sets it to "true".
name: CI

on:
  push:
    branches: [main]
  # Pull requests get the Rust and hygiene checks; the image (25 minutes on the heavy runner) is built on main
  # only, as the edge image, and by hand.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one; on main every push finishes (its image build, about
# 20 minutes, would otherwise be thrown away by the next merge, and edge would lag further behind).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Docs-only changes (Markdown, docs/ and the deploy examples) run the hygiene jobs only; the builds report themselves as skipped
    # (a passed check). The website picks the documentation up through its source submodules.
    name: What changed
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" "$HEAD")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(^|/)[^/]+\.md$|^docs/|^deploy/[^/]+\.example$'; then code=false; fi
            printf '%s\n' "$files" | head -100
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/rust-ci.yml@main
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      runner: tavrn-heavy
      # cargo deny with deny.toml (bans, licenses, sources; the advisories run in advisories.yml), rustfmt, clippy (node
      # and load generator), the tests on PostgreSQL (incl. the protocol test vectors and the comparison with
      # protocol/openapi.json from the submodule) with a Valkey for the cluster tests, then the same tests on SQLite,
      # the default database of small nodes and of --dev (like `just test` and `just test-pg`).
      clippy-args: --workspace --all-targets --locked
      test-args: --workspace --locked
      postgres: true
      test-sqlite: true
      # Two test runs (PostgreSQL, SQLite) after the build.
      timeout-minutes: 60
      pre-test: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          # The runner image ships livekit-server, ffmpeg and a private Valkey on 127.0.0.1:6379 (the
          # organization's runner/README.md); a container started on the stack's DinD would not be reachable
          # from this runner at 127.0.0.1 anyway.
          echo "TAVRN_TEST_CACHE_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
          livekit-server --version && ffmpeg -version | head -1 && valkey-cli -p 6379 ping
          exit 0
        fi
        # Every download is checked against a pinned SHA-256 (the same pins as the justfile).
        mkdir -p "$HOME/.local/bin"
        tmp="$(mktemp -d)"
        # Voice (protocol/VOICE.md): the node supervises livekit-server; the voice tests need the binary.
        lk="livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
        curl -fsSLo "$tmp/$lk" "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/$lk"
        echo "${LIVEKIT_SHA256}  $tmp/$lk" | sha256sum -c --quiet -
        tar -xzf "$tmp/$lk" -C "$HOME/.local/bin" livekit-server
        "$HOME/.local/bin/livekit-server" --version
        # Media pipeline (src/media.rs): ffmpeg with libwebp, like `just ffmpeg-install` (a dated build, not "latest").
        ff="${FFMPEG_ASSET}"
        curl -fsSLo "$tmp/$ff" "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/$ff"
        echo "${FFMPEG_SHA256}  $tmp/$ff" | sha256sum -c --quiet -
        tar -xJf "$tmp/$ff" -C "$tmp" --strip-components=2 --wildcards '*/bin/ffmpeg'
        install -m 0755 "$tmp/ffmpeg" "$HOME/.local/bin/ffmpeg"
        "$HOME/.local/bin/ffmpeg" -hide_banner -encoders | grep -q libwebp_anim
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # Valkey for the cluster tests (several instances of one node, docs/SCALING.md), pinned by digest.
        docker run -d --name valkey -p 56379:6379 valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
        for _ in $(seq 30); do docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      # Appended to GITHUB_ENV before pre-test runs. LIVEKIT_VERSION and the pins: the same as the justfile and
      # deploy/Dockerfile.
      test-env: |
        TAVRN_TEST_CACHE_URL=redis://127.0.0.1:56379
        TAVRN_TEST_REQUIRE_LIVEKIT=1
        LIVEKIT_VERSION=1.13.9
        LIVEKIT_SHA256=0b7fa208b662d09cfdeae8c06cf4c481aead0556086558b48250501e2e2d6e20
        FFMPEG_RELEASE=autobuild-2026-09-30-13-08
        FFMPEG_ASSET=ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
        FFMPEG_SHA256=97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
    secrets:
      # Kept for private checkouts; the repositories are public and tavrn-crypto comes from crates.io.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  hygiene:
    name: SPDX headers, publication hygiene, perf report
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: Tool pins (livekit-server, ffmpeg) agree between justfile, ci.yml and deploy/Dockerfile
        run: scripts/check-tool-pins.sh
      - name: No private files, domains or secrets
        env:
          # Comma-separated private domains, hosts and addresses (repository or organization secret).
          PUBLISH_CHECK_PRIVATE: ${{ secrets.PUBLISH_CHECK_PRIVATE }}
          # Dependabot's pull requests see only Dependabot secrets; the push to main runs the full check.
          PUBLISH_CHECK_ALLOW_UNCONFIGURED: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && '1' || '' }}
        run: scripts/publish-check.sh
      - name: Unit tests of the performance report
        run: node --test perf/report.test.ts

  web-ref:
    # The commit of tavrn-web that goes into the image. The build cache keys the web stage by its build arguments:
    # with the branch name alone ("main") a rebuilt image would keep the cached, stale bundle of an earlier main.
    # Resolving the branch to its current commit here makes every change of the web client a cache miss.
    name: Web client commit
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          WEB_REF: ${{ vars.TAVRN_WEB_REF || 'main' }}
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if printf '%s' "$WEB_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$WEB_REF"
          else
            url="https://github.com/just-tavrn/tavrn-web"
            [ -n "$READ_TOKEN" ] && url="https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/tavrn-web"
            sha="$(git ls-remote "$url" "refs/heads/$WEB_REF" "refs/tags/$WEB_REF^{}" "refs/tags/$WEB_REF" | head -1 | cut -f1)"
          fi
          [ -n "$sha" ] || { echo "::error::tavrn-web ref '$WEB_REF' not found"; exit 1; }
          echo "tavrn-web $WEB_REF = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  image:
    # Pushes to main (and manual runs on main) publish the image as ghcr.io/just-tavrn/tavrn-node:edge (plus a
    # short sha tag), the image tavrn-web's end-to-end suite runs against by default; pull requests do not build
    # it (development phase, 2026-10-08). Releases are tagged by release.yml. Built on ubuntu-latest, never on the
    # self-hosted runners: other repositories run this image's binary (just-tavrn/.github runner/README.md
    # "Security"), and a GitHub-hosted build shares no state with the self-hosted jobs.
    name: Container image
    needs: [web-ref, changes]
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true' }}
    uses: just-tavrn/.github/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      runner: ubuntu-latest
      dockerfile: deploy/Dockerfile
      image-name: tavrn-node
      # One manifest list for both; the Dockerfile cross-compiles arm64 on the amd64 runner (no emulated compiles).
      platforms: linux/amd64,linux/arm64
      build-args: |
        TAVRN_WEB_REF=${{ needs.web-ref.outputs.sha }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      # Read access to tavrn-crypto (cargo) and tavrn-web (the web stage), passed as the build secret read_token.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  shared-scripts:
    # The copies of the organization's shared scripts (SPDX check, publication check, labels, JS licenses) are the
    # source in just-tavrn/.github apart from their SPDX line (its docs/GITHUB.md "Shared scripts").
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/shared-scripts.yml@main
